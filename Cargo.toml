[package]
name = "novamind"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ring = "0.17"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = "0.4"
hex = "0.4"
tower-http = { version = "0.5", features = ["cors", "compression-full"] }
md5 = "0.7"