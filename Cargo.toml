[package]
name = "novamind-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "novamind-server"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
ring = "0.17"
hex = "0.4"
md5 = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
rusqlite = { version = "0.31", features = ["bundled"] }