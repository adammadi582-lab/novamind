<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaMind (NVD) - Ultra-Secure Global Network</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0d1117; color: #c9d1d9; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background-color: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 30px; width: 100%; max-width: 600px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        h1 { color: #58a6ff; text-align: center; font-size: 26px; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #8b949e; font-size: 12px; margin-bottom: 20px; }
        .global-stats { background: #21262d; border-radius: 8px; padding: 15px; margin-bottom: 15px; display: flex; justify-content: space-between; font-size: 14px; border: 1px solid #30363d; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; color: #58a6ff; }
        input, select { width: 100%; padding: 10px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: white; font-size: 14px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; transition: 0.25s; }
        .btn-primary { background-color: #238636; color: white; }
        .btn-primary:hover { background-color: #2ea043; }
        .btn-secondary { background-color: #1f6feb; color: white; margin-top: 10px; }
        .btn-secondary:hover { background-color: #388bfd; }
        .status-box { margin-top: 15px; padding: 12px; background: #21262d; border-radius: 6px; font-size: 13px; border-left: 4px solid #58a6ff; word-break: break-all; }
        .feed { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; height: 120px; overflow-y: auto; padding: 10px; font-family: monospace; font-size: 12px; color: #7ee787; }
    </style>
</head>
<body>

<div class="container">
    <h1>NovaMind (NVD)</h1>
    <div class="subtitle">Ultra-Secure Cryptographic Blockchain Ecosystem</div>

    <div class="global-stats">
        <span>Global Supply: <strong id="global-supply" style="color: #7ee787;">50.00 NVD</strong></span>
        <span>Security: <strong style="color: #58a6ff;">Ed25519 & SQLite Enforced</strong></span>
    </div>

    <!-- نظام توليد المحفظة المشفرة الحقيقية -->
    <div class="input-group">
        <label>Cryptographic Wallet Management</label>
        <button class="btn-primary" onclick="createWallet()">Create Secure Wallet (Ed25519)</button>
    </div>
    <div id="wallet-status" class="status-box" style="display:none;"></div>

    <!-- نظام التعدين الموزع والمربوط بالسيرفر -->
    <div class="input-group" style="margin-top: 20px;">
        <label>Academic & Cryptographic Mining Engine</label>
        <input type="text" id="miner-name" placeholder="Enter Your Miner Address / Name" style="margin-bottom: 10px;">
        <button id="mining-btn" class="btn-primary" onclick="toggleMining()">Start Mining Node 🚀</button>
    </div>

    <div style="text-align: center; margin: 15px 0;">
        <span style="font-size: 22px; font-weight: bold; color: #58a6ff;" id="balance-display">0.00 NVD</span>
    </div>

    <label style="margin-top: 15px;">Live Blockchain & Cryptographic Feed:</label>
    <div id="mining-feed" class="feed">System initialized. Connected to local Rust server backend...</div>
</div>

<script>
    let isMining = false;
    let miningInterval;
    let myBalance = 0.0;

    // دالة إنشاء محفظة مشفرة حقيقية من السيرفر
    async function createWallet() {
        try {
            let response = await fetch('http://localhost:8080/wallet/create');
            let data = await response.json();
            
            let statusBox = document.getElementById('wallet-status');
            statusBox.style.display = 'block';
            statusBox.innerHTML = `<strong>Wallet Created!</strong><br>Address: <code>${data.address}</code><br>Public Key: <code>${data.public_key}</code>`;
            
            // وضع العنوان تلقائياً في خانة المعدن
            document.getElementById('miner-name').value = data.address;
        } catch (error) {
            alert('Make sure the Rust server is running on port 8080!');
        }
    }

    // دالة التعدين وإرسال الحلول للبلوكتشين والدیسك توب
    function toggleMining() {
        const minerName = document.getElementById('miner-name').value;
        if (!minerName) {
            alert('Please create or enter a wallet address first!');
            return;
        }

        const btn = document.getElementById('mining-btn');
        const feed = document.getElementById('mining-feed');

        if (!isMining) {
            isMining = true;
            btn.innerText = 'Stop Mining';
            btn.className = 'btn-secondary';
            feed.innerHTML += `<br>[${new Date().toLocaleTimeString()}] Secure mining node started for: ${minerName}`;

            miningInterval = setInterval(async () => {
                let nonce = Math.floor(Math.random() * 1000000);
                try {
                    let response = await fetch('http://localhost:8080/mine', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ miner: minerName, nonce: nonce })
                    });

                    if (response.ok) {
                        let block = await response.json();
                        myBalance += block.reward;
                        document.getElementById('balance-display').innerText = `${myBalance.toFixed(2)} NVD`;
                        feed.innerHTML += `<br>[${new Date().toLocaleTimeString()}] Block #${block.index} Mined! Hash: ${block.hash.substring(0, 12)}...`;
                        feed.scrollTop = feed.scrollHeight;
                    }
                } catch (e) {
                    feed.innerHTML += `<br><span style="color: #f85149;">Connection error with server!</span>`;
                }
            }, 4000);
        } else {
            isMining = false;
            btn.innerText = 'Start Mining Node 🚀';
            btn.className = 'btn-primary';
            clearInterval(miningInterval);
            feed.innerHTML += `<br>[${new Date().toLocaleTimeString()}] Mining paused securely. State saved.`;
            feed.scrollTop = feed.scrollHeight;
        }
    }
</script>

</body>
</html>
