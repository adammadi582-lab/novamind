<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaMind (NVD) - Eco-Friendly Blockchain</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #090a0f;
            color: #e2e8f0;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #121824;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
            width: 100%;
            max-width: 600px;
            border: 1px solid #1e293b;
        }
        h2 {
            text-align: center;
            color: #fbbf24;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }
        p.subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .card {
            background: #0d111a;
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid #21262d;
        }
        .card h3 {
            margin-top: 0;
            font-size: 16px;
            color: #f1f5f9;
            border-bottom: 1px solid #21262d;
            padding-bottom: 8px;
        }
        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 8px;
            border: 1px solid #30363d;
            background: #161b22;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }
        input:focus {
            border-color: #fbbf24;
        }
        button {
            background: #21262d;
            border: 1px solid #30363d;
            color: #f0f6fc;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        button:hover {
            background: #30363d;
            border-color: #8b949e;
        }
        .btn-gold { 
            background: linear-gradient(135deg, #d97706, #b45309);
            color: #ffffff;
            border: none;
        }
        .btn-gold:hover { 
            background: linear-gradient(135deg, #f59e0b, #d97706);
        }
        .stats {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #fbbf24;
            background: #0d111a;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #21262d;
            margin-bottom: 20px;
        }
        pre {
            background: #05070b;
            padding: 12px;
            border-radius: 8px;
            font-size: 12px;
            overflow-x: auto;
            color: #34d399;
            border: 1px solid #1a202c;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>NovaMind (NVD) ⚡</h2>
    <p class="subtitle">Secure Academic Proof-of-Work & Layer 2 Ecosystem</p>

    <div class="stats">
        <span>🟢 Network: Online</span>
        <span>🛡️ Security: Ed25519 Active</span>
    </div>

    <!-- قسم المحفظة -->
    <div class="card">
        <h3>💼 Wallet Management</h3>
        <button onclick="createWallet()">Generate New Wallet</button>
        <div id="walletInfo" style="margin-top: 12px; font-size: 13px; word-break: break-all; color: #94a3b8;"></div>
    </div>

    <!-- قسم فحص الرصيد -->
    <div class="card">
        <h3>🔍 Check Balance & Wealth</h3>
        <input type="text" id="walletAddress" placeholder="Enter Wallet Address (e.g., nvd_...)">
        <button onclick="checkBalance()">Get Balance</button>
        <pre id="balanceResult">Result will appear here...</pre>
    </div>

    <!-- قسم التعدين الذكي -->
    <div class="card">
        <h3>⛏️ Smart Mine Block</h3>
        <input type="text" id="minerName" placeholder="Miner Name / Address">
        <input type="text" id="solutionSteps" placeholder="Solution Steps / Proof">
        <input type="number" id="devicePower" placeholder="Device Power Share (e.g., 1.0)" value="1.0">
        <button class="btn-gold" onclick="mineBlock()">Submit & Mine Block</button>
        <pre id="mineResult">Mining output...</pre>
    </div>
</div>

<script>
    // تم تعديل الـ API_URL ليستخدم نفس نطاق السيرفر الحالي تلقائياً دون تثبيت بورت 8080
    const API_URL = "";

    async function createWallet() {
        try {
            const res = await axios.get(`${API_URL}/wallet/create`);
            document.getElementById('walletInfo').innerHTML = `
                <b style="color: #fbbf24;">Address:</b> ${res.data.address}<br>
                <b style="color: #fbbf24;">Public Key:</b> ${res.data.public_key}
            `;
            document.getElementById('walletAddress').value = res.data.address;
        } catch (err) {
            alert("Error connecting to server!");
        }
    }

    async function checkBalance() {
        const address = document.getElementById('walletAddress').value;
        if (!address) {
            alert("Please enter a wallet address!");
            return;
        }
        try {
            const res = await axios.get(`${API_URL}/wallet/balance/${address}`);
            document.getElementById('balanceResult').innerText = JSON.stringify(res.data, null, 2);
        } catch (err) {
            document.getElementById('balanceResult').innerText = "Error fetching balance.";
        }
    }

    async function mineBlock() {
        const miner = document.getElementById('minerName').value;
        const solution_steps = document.getElementById('solutionSteps').value;
        const device_power_share = parseFloat(document.getElementById('devicePower').value);

        if (!miner || !solution_steps) {
            alert("Please fill in miner name and solution steps!");
            return;
        }

        try {
            const res = await axios.post(`${API_URL}/mine`, {
                miner,
                solution_steps,
                device_power_share
            });
            document.getElementById('mineResult').innerText = JSON.stringify(res.data, null, 2);
        } catch (err) {
            document.getElementById('mineResult').innerText = "Mining failed.";
        }
    }
</script>

</body>
</html>
